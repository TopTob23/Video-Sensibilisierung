<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ein ganz normaler Montag – V1.0</title>
<!--
  „Ein ganz normaler Montag“ – Erklärvideo (Motion Graphics) für die Verwaltungsführung der Stadt Herne
  Vertraulich – nur zur internen Verwendung
  Eine Datei: Illustrationen (SVG im Code), Zeitleiste, render(t), Untertitel, Vorschau.
  render(t) ist eine reine Funktion der Zeit t in Sekunden – keine Echtzeit, kein Zufall ohne festen Startwert.
  Vorschau: Datei im Browser öffnen. Export: siehe export/render.mjs (ruft window.renderFrame(t) Bild für Bild auf).
-->
<style>
  :root {
    --gruen: #007D30; --zyan: #00A5D7; --hellgruen: #CAF278;
    --flaeche: #F5F7F7; --flaeche2: #EAF5EE; --text: #1F292D; --text2: #5B666B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #151c1f; color: #F5F7F7; font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
  #app { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #viewport { position: relative; width: 100%; max-width: 1600px; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #fff; }
  .slot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; isolation: isolate; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  .tint { mix-blend-mode: multiply; pointer-events: none; }
  svg text, .t { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
  /* Bedienleiste der Vorschau */
  #controls { width: 100%; max-width: 1600px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; }
  #controls button { background: #26343a; color: #F5F7F7; border: 1px solid #3a4b52; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #controls button:hover { background: #31444c; }
  #controls button.on { background: #007D30; border-color: #0a9a42; }
  #scrub { flex: 1 1 420px; accent-color: #00A5D7; }
  #tc { font-variant-numeric: tabular-nums; min-width: 150px; }
  #sceneBtns { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  #sceneName { color: #CAF278; }
  /* Export-Modus: Bühne 1:1, keine Bedienelemente */
  body.export { background: #000; overflow: hidden; }
  body.export #app { padding: 0; display: block; }
  body.export #viewport { max-width: none; width: 1920px; height: 1080px; aspect-ratio: auto; }
  body.export #controls { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport"><div id="stage"></div></div>
  <div id="controls">
    <button id="bStart" title="Zum Anfang (Pos1)">⏮</button>
    <button id="bPlay" title="Abspielen / Pause (Leertaste)">▶ Abspielen</button>
    <button id="bBackS" title="1 Sekunde zurück (Umschalt + ←)">−1 s</button>
    <button id="bBackF" title="1 Bild zurück (←)">−1 Bild</button>
    <button id="bNextF" title="1 Bild vor (→)">+1 Bild</button>
    <button id="bNextS" title="1 Sekunde vor (Umschalt + →)">+1 s</button>
    <input id="scrub" type="range" min="0" max="454" step="0.0333333" value="0" aria-label="Zeitleiste">
    <span id="tc">00:00:00</span>
    <span id="sceneName"></span>
    <div id="sceneBtns"></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

const SCENES = SZENEN.map(z => {
  const t = TIMELINE && TIMELINE.szenen[z.n];
  return { n: z.n, title: z.title, start: t ? t.start : z.nominal[0], end: t ? t.end : z.nominal[1], entwurf: t ? t.entwurf : z.nominal[1] - z.nominal[0], anker: t ? t.anker : [], tail: t ? t.tail : 1 };
});
const TOTAL = SCENES[SCENES.length - 1].end;   // Sekunden

// Bild-Ton-Abgleich: tatsächliche Szenenzeit x → Entwurfszeit (vor dem ersten Anker in Echtzeit, dazwischen linear, danach mit Steigung tail)
function toDesign(sc, x) {
  const P = sc.anker;
  if (!P || !P.length) return x;
  if (x <= P[0][1]) return P[0][0] + (x - P[0][1]);
  for (let i = 1; i < P.length; i++) if (x <= P[i][1]) return P[i - 1][0] + (P[i][0] - P[i - 1][0]) * (x - P[i - 1][1]) / (P[i][1] - P[i - 1][1]);
  const L = P[P.length - 1];
  return L[0] + (x - L[1]) * sc.tail;
}
// Entwurfszeit d in Szene n → absolute Zeit im Video
function toActual(n, d) {
  const sc = SCENES.find(z => z.n === n), P = sc.anker;
  let x = d;
  if (P && P.length) {
    if (d <= P[0][0]) x = P[0][1] + (d - P[0][0]);
    else {
      x = null;
      for (let i = 1; i < P.length; i++) if (d <= P[i][0]) { x = P[i - 1][1] + (P[i][1] - P[i - 1][1]) * (d - P[i - 1][0]) / (P[i][0] - P[i - 1][0]); break; }
      if (x === null) { const L = P[P.length - 1]; x = L[1] + (d - L[0]) / sc.tail; }
    }
  }
  return sc.start + x;
}

/* =====================================================================
   2  HILFSFUNKTIONEN: Mathematik, Easing, Seed-Zufall, Farben, SVG-Bausteine
   ===================================================================== */
const DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const EASE = {
  lin: u => u,
  inOut: u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  sine: u => 0.5 - 0.5 * Math.cos(Math.PI * u),
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  outBack: u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const ez = (t, a, b, fn = EASE.inOut) => fn(seg(t, a, b));
const fadeIO = (t, a, b, c, d) => Math.min(ez(t, a, b), 1 - ez(t, c, d));   // 0→1 (a..b), 1→0 (c..d)
const bump = (t, c, w) => { const u = (t - c) / w; return Math.abs(u) >= 1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * u); };
// Seed-Zufall (mulberry32): gleiche Eingabe → gleiche Folge
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rng = seed => mulberry32(seed >>> 0);
// weiche, deterministische Schwankung (Summe zweier Sinuswellen)
const wob = (t, seed, f = 1) => Math.sin(t * f * 1.3 + seed * 1.7) * 0.6 + Math.sin(t * f * 2.1 + seed * 3.1) * 0.4;

// Farben
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, u) { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(lerp(x[0], y[0], u), lerp(x[1], y[1], u), lerp(x[2], y[2], u)); }
const shade = (c, k) => { const [r, g, b] = hex2rgb(c); return rgb2hex(r * k, g * k, b * k); };

// SVG-Zeichenketten
// vier Nachkommastellen: gröbere Rundung ließ langsame Zooms in 1-%-Stufen springen
const N = v => Math.round(v * 10000) / 10000;
function A(o) {
  let s = '';
  for (const k in o) {
    const v = o[k];
    if (v === undefined || v === null || v === false) continue;
    s += ` ${k}="${typeof v === 'number' ? N(v) : v}"`;
  }
  return s;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const G = (o, inner) => `<g${A(o)}>${inner}</g>`;
const Circ = (cx, cy, r, fill, o = {}) => `<circle${A({ cx, cy, r: Math.max(0, r), fill, ...o })}/>`;
const Ell = (cx, cy, rx, ry, fill, o = {}) => `<ellipse${A({ cx, cy, rx: Math.max(0, rx), ry: Math.max(0, ry), fill, ...o })}/>`;
const Rect = (x, y, w, h, fill, o = {}) => `<rect${A({ x, y, width: Math.max(0, w), height: Math.max(0, h), fill, ...o })}/>`;
const Path = (d, fill, o = {}) => `<path${A({ d, fill, ...o })}/>`;
const Line = (x1, y1, x2, y2, stroke, sw, o = {}) => `<line${A({ x1, y1, x2, y2, stroke, 'stroke-width': sw, 'stroke-linecap': 'round', ...o })}/>`;
const Poly = (pts, stroke, sw, o = {}) => `<polyline${A({ points: pts.map(p => N(p[0]) + ',' + N(p[1])).join(' '), fill: 'none', stroke, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...o })}/>`;
const Use = (id, o = {}) => `<use${A({ href: '#' + id, ...o })}/>`;
const TR = (x, y, s = 1, r = 0, sx) => `translate(${N(x)} ${N(y)})` + (r ? ` rotate(${N(r)})` : '') + (sx !== undefined ? ` scale(${N(sx)} ${N(s)})` : s !== 1 ? ` scale(${N(s)})` : '');
const P = pts => 'M' + pts.map(p => N(p[0]) + ',' + N(p[1])).join(' L') + ' Z';
const OL = (sw = 3, color) => ({ stroke: color || C.line, 'stroke-width': sw, 'stroke-linejoin': 'round' });
// Kontur-Glied: dicke Linie mit dunklem Rand (Arme, Beine, Äste)
const Limb = (pts, color, w, sw = 3) => Poly(pts, C.line, w + 2 * sw) + Poly(pts, color, w);

// Schrift und Textmessung (Arial bzw. die maßgleiche Ersatzschrift)
const FONT = 'Arial, "Liberation Sans", Helvetica, sans-serif';
const _mctx = document.createElement('canvas').getContext('2d');
function measure(str, size, weight = 400) { _mctx.font = `${weight} ${size}px ${FONT}`; return _mctx.measureText(str).width; }
// Jeder sichtbare Text trägt eine Kennung: data-k = Schlüssel in TEXTE/TEXTE_AUSNAHMEN, data-i = Zeilennummer
function Txt(x, y, str, o = {}) {
  const { size = 40, weight = 400, fill = C.text, anchor = 'start', opacity, ls, italic } = o;
  return `<text class="t"${A({ x, y, 'font-size': size, 'font-weight': weight, fill, 'text-anchor': anchor, opacity, 'letter-spacing': ls, 'font-style': italic ? 'italic' : undefined, 'data-k': o.k, 'data-i': o.i, 'data-cue': o.cue })}>${esc(str)}</text>`;
}
// Zeilenumbruch nur an Leerzeichen (Text bleibt wortgleich)
function wrapLines(str, size, weight, maxW) {
  const words = str.split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && measure(t, size, weight) > maxW) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// Mehrzeiliger Text aus TEXTE[key]; o.lines = feste Zeilen (müssen zusammen den Text ergeben), sonst automatischer Umbruch
function TextBlock(key, x, y, o = {}) {
  const src = TEXTE[key] ?? TEXTE_AUSNAHMEN[key];
  const size = o.size || 40, weight = o.weight || 400;
  const lines = o.lines || wrapLines(src, size, weight, o.maxW || 1e9);
  const lh = o.lh || size * 1.25;
  return lines.map((l, i) => Txt(x, y + i * lh, l, { ...o, size, weight, k: key, i })).join('');
}
const blockLines = (key, size, weight, maxW) => wrapLines(TEXTE[key], size, weight, maxW);

// Blob aus Kreisen: Kontur, dunkle Basis, hellere Fläche (versetzt), optionale Glanzpunkte
function Blob(lobes, pal, sw) {
  let o = '', d = '', m = '', l = '';
  for (const [x, y, r] of lobes) { o += Circ(x, y, r + sw, C.line); d += Circ(x, y, r, pal.dark); }
  for (const [x, y, r] of lobes) m += Circ(x - r * 0.09, y - r * 0.13, r * 0.86, pal.mid);
  if (pal.light) for (const [x, y, r, hl] of lobes) if (hl) l += Circ(x - r * 0.28, y - r * 0.34, r * 0.34, pal.light);
  return o + d + m + l;
}
const LEAF = { dark: C.leafDark, mid: C.leafMid, light: C.leafLight };
const BUSH = { dark: C.bushDark, mid: C.bushMid, light: C.bushLight };

// Laubbaum: x,y = Stammfuß; s = Maßstab (1 ≈ 470 px hoch)
function Tree(x, y, s, seed, o = {}) {
  const r = rng(seed);
  const trunkH = (o.trunkH || 190) * s;
  const cw = (o.cw || 150) * s, ch = (o.ch || 125) * s;
  const cx = x + (o.lean || 0) * s, cy = y - trunkH - ch * 0.45;
  const tw = (o.tw || 13) * s, sw = (o.sw || 3) * Math.max(0.6, Math.min(1.2, s));
  let t = Path(`M${N(x - tw)},${N(y)} C${N(x - tw * 0.8)},${N(y - trunkH * 0.5)} ${N(cx - tw * 0.7)},${N(y - trunkH * 0.9)} ${N(cx - tw * 0.55)},${N(cy + ch * 0.2)} L${N(cx + tw * 0.55)},${N(cy + ch * 0.2)} C${N(cx + tw * 0.7)},${N(y - trunkH * 0.9)} ${N(x + tw * 0.8)},${N(y - trunkH * 0.5)} ${N(x + tw)},${N(y)} Z`, C.trunk, OL(sw));
  const by = y - trunkH * 0.72;
  t += Limb([[x, by], [cx - cw * 0.42, cy + ch * 0.2]], C.trunk, tw * 0.7, sw);
  t += Limb([[x + tw * 0.2, by - 20 * s], [cx + cw * 0.38, cy + ch * 0.05]], C.trunk, tw * 0.6, sw);
  const lobes = [];
  const n = o.n || 12;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + r() * 0.45;
    const rr = 0.62 + r() * 0.3;
    const lr = (0.34 + r() * 0.14) * Math.min(cw, ch) * 1.15;
    const lx = cx + Math.cos(a) * cw * rr * 0.78, ly = cy + Math.sin(a) * ch * rr * 0.72;
    lobes.push([lx, ly, lr, ly < cy + ch * 0.1]);
  }
  lobes.push([cx, cy, Math.min(cw, ch) * 0.78, true]);
  lobes.push([cx - cw * 0.3, cy - ch * 0.25, Math.min(cw, ch) * 0.5, true]);
  return t + Blob(lobes, o.pal || LEAF, sw);
}

// Busch mit flacher Unterkante: x = Mitte, y = Boden
function Bush(x, y, w, h, seed, o = {}) {
  const r = rng(seed);
  const sw = o.sw || 3;
  const lobes = [];
  const n = Math.max(3, Math.round(w / (h * 0.55)));
  for (let i = 0; i < n; i++) {
    const u = n === 1 ? 0.5 : i / (n - 1);
    const lx = x - w / 2 + h * 0.42 + u * (w - h * 0.84);
    const lr = h * (0.36 + r() * 0.16);
    lobes.push([lx, y - lr * 0.95 - r() * h * 0.18, lr, true]);
  }
  lobes.push([x, y - h * 0.5, h * 0.48, true]);
  const pal = o.pal || BUSH;
  let s = Blob(lobes, pal, sw);
  // flache Unterkante
  s += Rect(x - w / 2 - 2, y - 4, w + 4, 10, pal.dark, OL(sw));
  return G({ 'clip-path': o.clip ? `url(#${o.clip})` : undefined }, s);
}

// Wolke mit flacher Unterseite
function Cloud(x, y, s) {
  const lobes = [[-70, -16, 28], [-30, -40, 38], [20, -50, 45], [64, -30, 32], [96, -14, 20]].map(([a, b, r]) => [x + a * s, y + b * s, r * s]);
  const bx = x - 96 * s, by = y - 26 * s, bw = 212 * s, bh = 26 * s;
  let o = '', f = '';
  for (const [cx, cy, r] of lobes) { o += Circ(cx, cy, r + 2.5, C.cloudLine); f += Circ(cx, cy, r, '#FFFFFF'); }
  o += Rect(bx - 2.5, by - 2.5, bw + 5, bh + 5, C.cloudLine, { rx: 13 * s + 2.5 });
  f += Rect(bx, by, bw, bh, '#FFFFFF', { rx: 13 * s });
  f += Rect(bx + 16 * s, by + 14 * s, bw - 40 * s, 6 * s, '#E4EEF4', { rx: 3 * s });
  return o + f;
}

/* =====================================================================
   5  FIGUREN-BAUKASTEN
   Ursprung = Fußmitte am Boden, Blick nach rechts (dir = -1 spiegelt).
   Maße bei s = 1: Erwachsene ca. 290 px hoch. Winkel in Grad: 0 = senkrecht
   nach unten, positiv = in Blickrichtung.
   ===================================================================== */
const pt = (x, y, ang, len) => [x + Math.sin(ang * DEG) * len, y + Math.cos(ang * DEG) * len];
const angOf = (dx, dy) => Math.atan2(dx, dy) / DEG;
// Zwei-Glieder-IK: liefert beide möglichen Mittelgelenke
function ik2(ax, ay, bx, by, l1, l2) {
  const dx = bx - ax, dy = by - ay;
  const d = Math.max(1e-3, Math.min(Math.hypot(dx, dy), (l1 + l2) * 0.999));
  const base = Math.atan2(dy, dx);
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  return [[ax + l1 * Math.cos(base + a), ay + l1 * Math.sin(base + a)], [ax + l1 * Math.cos(base - a), ay + l1 * Math.sin(base - a)]];
}

// Frisuren (Kopfmitte 0,0; r = Kopfradius). back = hinter Kopf, front = über Kopf
function hairShapes(style, r) {
  const k = v => N(v * r);
  const shortFront = `M${k(0.86)},${k(-0.36)} C${k(0.92)},${k(-1.12)} ${k(-0.18)},${k(-1.34)} ${k(-0.7)},${k(-1.05)} C${k(-1.12)},${k(-0.8)} ${k(-1.14)},${k(-0.1)} ${k(-0.92)},${k(0.36)} L${k(-0.6)},${k(0.3)} C${k(-0.7)},${k(-0.16)} ${k(-0.46)},${k(-0.56)} ${k(-0.08)},${k(-0.62)} C${k(0.32)},${k(-0.7)} ${k(0.62)},${k(-0.56)} ${k(0.86)},${k(-0.36)} Z`;
  const longBack = `M${k(0.55)},${k(-0.92)} C${k(-0.25)},${k(-1.32)} ${k(-1.28)},${k(-0.92)} ${k(-1.18)},${k(0.2)} C${k(-1.12)},${k(0.95)} ${k(-1.05)},${k(1.45)} ${k(-0.72)},${k(1.82)} L${k(0.28)},${k(1.82)} C${k(0.08)},${k(1.2)} ${k(-0.22)},${k(0.72)} ${k(-0.2)},${k(0.3)} Z`;
  const fringe = `M${k(0.9)},${k(-0.2)} C${k(1.0)},${k(-1.12)} ${k(-0.2)},${k(-1.36)} ${k(-0.74)},${k(-1.02)} C${k(-1.14)},${k(-0.76)} ${k(-1.16)},${k(-0.05)} ${k(-0.96)},${k(0.5)} L${k(-0.58)},${k(0.36)} C${k(-0.66)},${k(-0.12)} ${k(-0.4)},${k(-0.5)} ${k(0.02)},${k(-0.58)} C${k(0.44)},${k(-0.64)} ${k(0.74)},${k(-0.44)} ${k(0.9)},${k(-0.2)} Z`;
  switch (style) {
    case 'long': return { back: longBack, front: fringe };
    case 'ponytail': return { back: `M${k(-0.78)},${k(-0.62)} C${k(-1.5)},${k(-0.7)} ${k(-1.62)},${k(0.2)} ${k(-1.42)},${k(0.86)} C${k(-1.3)},${k(0.5)} ${k(-1.12)},${k(0.1)} ${k(-0.86)},${k(-0.12)} Z`, front: shortFront, tie: [-0.9, -0.42] };
    case 'bun': return { back: `M${k(-0.3)},${k(-1.02)} m${k(-0.42)},0 a${k(0.42)},${k(0.42)} 0 1,0 ${k(0.84)},0 a${k(0.42)},${k(0.42)} 0 1,0 ${k(-0.84)},0 Z`, front: shortFront };
    case 'bald': return { back: '', front: `M${k(-0.98)},${k(0.3)} C${k(-1.08)},${k(-0.2)} ${k(-0.9)},${k(-0.5)} ${k(-0.62)},${k(-0.58)} L${k(-0.5)},${k(-0.2)} C${k(-0.62)},${k(0)} ${k(-0.66)},${k(0.14)} ${k(-0.62)},${k(0.3)} Z` };
    default: return { back: '', front: shortFront };
  }
}

/*
  Person(o): Figur im Flat-Vector-Stil.
  o: x, y, s, dir, kid, walk (0..1), phase, stride, lean, skin, hair, hairStyle, top, jacket, coat,
     pants, shoes, backpack, bag, cap, hood, mood ('smile' | 'neutral' | 'concern'),
     legs {f,b:{hip,knee}}, arms {f,b:{sh,el}}, hipY, seated, before, afterFarLeg, after, out
*/
function Person(o) {
  const s = o.s ?? 1, dir = o.dir ?? 1, kid = !!o.kid;
  const walk = o.walk ?? 0, ph = o.phase ?? 0;
  const skin = o.skin || C.skin1;
  const topC = o.top || '#FFFFFF';
  const sleeve = o.sleeve || o.coat || o.jacket || topC;
  const pants = o.pants || C.jeans, shoes = o.shoes || '#FFFFFF';
  const L1 = kid ? 46 : 68, L2 = kid ? 44 : 64, ANK = kid ? 8 : 10;
  const TOR = kid ? 62 : 84, HR = kid ? 26 : 24;
  const UA = kid ? 34 : 52, FA = kid ? 32 : 48;
  const LW = kid ? 19 : 23, AW = kid ? 14 : 16.5, SW = 3;
  const amp = (o.stride ?? 18) * walk;
  const legAt = psi => ({ hip: amp * Math.sin(psi), knee: 4 + 38 * walk * Math.pow(Math.max(0, Math.cos(psi)), 2) });
  let lf = walk ? legAt(ph) : { hip: 3, knee: 3 };
  let lb = walk ? legAt(ph + Math.PI) : { hip: -3, knee: 3 };
  if (o.seated) { lf = { hip: 86, knee: 86 }; lb = { hip: 80, knee: 82 }; }
  if (o.legs) { lf = o.legs.f || lf; lb = o.legs.b || lb; }
  const armAmp = 15 * walk;
  let af = { sh: -armAmp * Math.sin(ph) + 3, el: 12 + 12 * walk * Math.max(0, -Math.sin(ph)) };
  let ab = { sh: armAmp * Math.sin(ph) - 3, el: 12 + 12 * walk * Math.max(0, Math.sin(ph)) };
  if (o.arms) { af = o.arms.f || af; ab = o.arms.b || ab; }
  const bob = o.seated ? 0 : walk * 6 * Math.pow(Math.sin(ph), 2);
  const hipY = o.hipY ?? (o.seated ? -(L2 + ANK) : -(L1 + L2 + ANK) + bob);
  const lean = (o.lean ?? walk * 3) + (o.senior ? 4 : 0);
  const shY = hipY - TOR;
  const hs = kid ? 20 : 26;                 // halbe Schulterbreite
  const headC = [3, shY - 9 - HR];
  const legPts = (hx, l) => { const k = pt(hx, hipY, l.hip, L1); const a = pt(k[0], k[1], l.hip - l.knee, L2); return [[hx, hipY], k, a]; };
  const shoulderF = [hs - 5, shY + 9], shoulderB = [-hs + 6, shY + 9];
  // Arm-IK auf Weltziel (optional)
  const toLocal = (wx, wy) => {
    let lx = (wx - (o.x || 0)) / (s * dir), ly = (wy - (o.y || 0)) / s;
    const c = Math.cos(-lean * DEG), sn = Math.sin(-lean * DEG);
    const dx = lx, dy = ly - hipY;
    return [dx * c - dy * sn, hipY + dx * sn + dy * c];
  };
  const armIK = (sh, target, lowElbow = true) => {
    const [tx, ty] = toLocal(target[0], target[1]);
    const [e1, e2] = ik2(sh[0], sh[1], tx, ty, UA, FA);
    const e = (lowElbow ? (e1[1] > e2[1]) : (e1[1] < e2[1])) ? e1 : e2;
    const a1 = angOf(e[0] - sh[0], e[1] - sh[1]);
    const a2 = angOf(tx - e[0], ty - e[1]);
    return { sh: a1, el: a2 - a1 };
  };
  if (o.reachF) af = armIK(shoulderF, o.reachF, o.reachFLow ?? true);
  if (o.reachB) ab = armIK(shoulderB, o.reachB, o.reachBLow ?? true);
  const armPts = (sp, a) => { const e = pt(sp[0], sp[1], a.sh, UA); const w = pt(e[0], e[1], a.sh + a.el, FA); return [sp, e, w]; };
  const shoe = (p, shin) => {
    const ang = Math.max(0, -shin) * 0.55;
    return Path('M-9,-7 L4,-9 Q19,-8 23,1 L23,7 L-10,7 Z', shoes, { ...OL(SW), transform: `translate(${N(p[0])} ${N(p[1] + ANK - 7)}) rotate(${N(ang)})` });
  };
  const legSVG = (hx, l, col) => { const p = legPts(hx, l); return Limb(p, col, LW, SW) + shoe(p[2], l.hip - l.knee); };
  const armSVG = (sp, a, col, handSkin = skin) => {
    const p = armPts(sp, a);
    let svg = Limb(p, col, AW, SW);
    if (o.shortSleeves) svg = Limb([p[0], p[1]], col, AW, SW) + Limb([p[1], p[2]], handSkin, AW - 3, SW) + Limb([p[0], pt(p[0][0], p[0][1], a.sh, UA * 0.55)], col, AW + 2, SW);
    return svg + Circ(p[2][0], p[2][1], kid ? 7 : 8.5, handSkin, OL(SW));
  };

  let body = o.before || '';
  // Rucksack hinten (dreht mit dem Oberkörper)
  const pack = o.backpack ? Path(`M${-hs - 12},${shY + 12} Q${-hs - 14},${shY + 2} ${-hs},${shY + 4} L${-hs + 8},${shY + 6} L${-hs + 8},${hipY - 8} L${-hs - 10},${hipY - 12} Q${-hs - 16},${hipY - 20} ${-hs - 14},${hipY - 34} Z`, o.backpack, OL(SW)) : '';
  // hinteres Haar (lang/Zopf)
  const hair = hairShapes(o.hairStyle || 'short', HR);
  const hairC = o.hair || C.hairBrown;
  const headT = `translate(${N(headC[0])} ${N(headC[1])})`;
  let upperBack = '';
  if (o.hood) upperBack += Path(`M${-hs + 2},${shY + 4} Q${-hs - 6},${shY - 26} ${-4},${shY - 22} L${6},${shY + 2} Z`, o.hood, OL(SW));
  if (hair.back) upperBack += Path(hair.back, hairC, { ...OL(SW), transform: headT });
  // hinterer Arm
  upperBack = armSVG(shoulderB, ab, shade(sleeve, 0.86)) + upperBack;
  // Beine
  let legs = legSVG(-8, lb, shade(pants, 0.86)) + (o.afterFarLeg || '') + legSVG(8, lf, pants);
  // Rumpf
  const torsoD = `M${-hs},${shY + 8} Q${-hs + 1},${shY - 2} ${-hs + 12},${shY - 3} L${hs - 12},${shY - 3} Q${hs - 1},${shY - 2} ${hs},${shY + 8} L${hs - 3},${hipY + 4} Q0,${hipY + 9} ${-hs + 3},${hipY + 4} Z`;
  let torso = Rect(-6, shY - 14, 12, 18, skin, OL(SW));   // Hals
  if (o.coat) {
    torso += Path(`M${-hs},${shY + 8} Q${-hs + 1},${shY - 2} ${-hs + 12},${shY - 3} L${hs - 12},${shY - 3} Q${hs - 1},${shY - 2} ${hs},${shY + 8} L${hs + 6},${hipY + 62} Q0,${hipY + 67} ${-hs - 6},${hipY + 62} Z`, o.coat, OL(SW));
    torso += Path(`M3,${shY - 2} L15,${shY - 2} L12,${hipY + 8} L5,${hipY + 8} Z`, topC, OL(2));
    torso += Line(8, hipY + 12, 10, hipY + 60, C.line, 2);
  } else if (o.jacket) {
    torso += Path(torsoD, o.jacket, OL(SW));
    torso += Path(`M2,${shY - 2} L15,${shY - 2} L13,${hipY + 5} L4,${hipY + 5} Z`, topC, OL(2));
    torso += Path(`M2,${shY - 2} L-3,${shY + 18} L4,${shY + 30}`, 'none', { stroke: C.line, 'stroke-width': 2, 'stroke-linejoin': 'round' });
  } else {
    torso += Path(torsoD, topC, OL(SW));
    torso += Path(`M-6,${shY - 3} Q3,${shY + 7} 12,${shY - 3}`, 'none', { stroke: C.line, 'stroke-width': 2 });
  }
  if (o.backpack) torso += Line(-hs + 9, shY + 2, -hs + 11, hipY - 8, shade(o.backpack, 0.8), 5) + Line(hs - 8, shY + 2, hs - 10, shY + 44, shade(o.backpack, 0.8), 5);
  // Kopf
  let head = '';
  head += Ell(-0.5 * HR, 0.08 * HR, 0.17 * HR, 0.23 * HR, skin, OL(2.5));  // Ohr
  head += Circ(0, 0, HR, skin, OL(SW));
  if (!o.faceless) {
    const eye = C.line;
    head += Ell(0.2 * HR, -0.04 * HR, 0.1 * HR, 0.13 * HR, eye) + Ell(0.62 * HR, -0.04 * HR, 0.09 * HR, 0.12 * HR, eye);
    head += Path(`M${N(0.08 * HR)},${N(-0.28 * HR)} Q${N(0.2 * HR)},${N(-0.36 * HR)} ${N(0.32 * HR)},${N(-0.3 * HR)} M${N(0.52 * HR)},${N(-0.3 * HR)} Q${N(0.64 * HR)},${N(-0.36 * HR)} ${N(0.74 * HR)},${N(-0.28 * HR)}`, 'none', { stroke: shade(o.hair || C.hairBrown, 0.9), 'stroke-width': 2.2, 'stroke-linecap': 'round' });
    head += Path(`M${N(0.86 * HR)},${N(0.0 * HR)} Q${N(1.0 * HR)},${N(0.2 * HR)} ${N(0.8 * HR)},${N(0.24 * HR)}`, 'none', { stroke: shade(skin, 0.72), 'stroke-width': 2, 'stroke-linecap': 'round' });
    const mood = o.mood || 'smile';
    const mouth = mood === 'smile' ? `M${N(0.3 * HR)},${N(0.44 * HR)} Q${N(0.52 * HR)},${N(0.62 * HR)} ${N(0.72 * HR)},${N(0.42 * HR)}`
      : mood === 'concern' ? `M${N(0.34 * HR)},${N(0.54 * HR)} Q${N(0.52 * HR)},${N(0.44 * HR)} ${N(0.7 * HR)},${N(0.54 * HR)}`
      : `M${N(0.34 * HR)},${N(0.5 * HR)} L${N(0.7 * HR)},${N(0.5 * HR)}`;
    head += Path(mouth, 'none', { stroke: C.line, 'stroke-width': 2.2, 'stroke-linecap': 'round' });
  }
  head += Path(hair.front, hairC, OL(SW));
  if (hair.tie) head += Circ(hair.tie[0] * HR, hair.tie[1] * HR, 3.5, shade(hairC, 0.6));
  if (o.cap) head += Path(`M${-HR * 0.95},${-HR * 0.25} C${-HR * 0.95},${-HR * 1.3} ${HR * 0.95},${-HR * 1.3} ${HR * 0.98},${-HR * 0.28} Z`, o.cap, OL(SW)) + Path(`M${HR * 0.7},${-HR * 0.32} L${HR * 1.55},${-HR * 0.22} Q${HR * 1.62},${-HR * 0.06} ${HR * 1.4},${-HR * 0.04} L${HR * 0.62},${-HR * 0.1} Z`, shade(o.cap, 0.9), OL(SW));
  head = G({ transform: headT }, head);
  // Tasche
  let bag = '';
  if (o.bag) bag = Line(hs - 6, shY + 2, -hs + 2, hipY + 2, shade(o.bag, 0.75), 4) + Rect(-hs - 14, hipY - 8, 30, 30, o.bag, { ...OL(SW), rx: 5 });
  // vorderer Arm
  const armFront = armSVG(shoulderF, af, sleeve);

  const upper = G({ transform: lean ? `rotate(${N(lean)} 0 ${N(hipY)})` : undefined }, pack + upperBack + torso + head + bag + armFront);
  body += legs + upper;
  // Gelenkpositionen nach außen (Welt)
  if (o.out) {
    const toWorld = ([lx, ly]) => {
      const c = Math.cos(lean * DEG), sn = Math.sin(lean * DEG);
      const dx = lx, dy = ly - hipY;
      const rx = dx * c - dy * sn, ry = hipY + dx * sn + dy * c;
      return [(o.x || 0) + rx * s * dir, (o.y || 0) + ry * s];
    };
    o.out.handF = toWorld(armPts(shoulderF, af)[2]);
    o.out.handB = toWorld(armPts(shoulderB, ab)[2]);
    o.out.shF = toWorld(shoulderF);
    o.out.shB = toWorld(shoulderB);
    o.out.head = toWorld(headC);
  }
  return G({ transform: `translate(${N(o.x || 0)} ${N(o.y || 0)}) scale(${N(s * dir)} ${N(s)})` }, body + (o.after || ''));
}

// Gangphase aus zurückgelegter Strecke (verhindert „Gleiten“ der Füße)
const stepPhase = (dist, s, stride = 18) => Math.PI * dist / (2 * 132 * Math.sin(stride * DEG) * s);

// Radfahrerin/Radfahrer: Rad mit Kurbel-IK
function Cyclist(o) {
  const s = o.s ?? 1, dir = o.dir ?? 1;
  const crank = o.crank ?? 0, wheelRot = o.wheel ?? 0;
  const frame = o.frameColor || '#3F8C4B';
  const RW = [-94, -60], FW = [96, -60], BB = [0, -50], R = 57;
  const wheel = (c) => {
    let w = Circ(c[0], c[1], R + 3, C.line) + Circ(c[0], c[1], R - 3, '#FFFFFF', { opacity: 0.001 });
    w += Circ(c[0], c[1], R, 'none', { stroke: C.line, 'stroke-width': 9 }) + Circ(c[0], c[1], R - 7, 'none', { stroke: '#9AA2A6', 'stroke-width': 3 });
    for (let i = 0; i < 8; i++) { const a = wheelRot + i * Math.PI / 4; w += Line(c[0], c[1], c[0] + Math.cos(a) * (R - 8), c[1] + Math.sin(a) * (R - 8), '#9AA2A6', 1.6); }
    return w + Circ(c[0], c[1], 5, '#9AA2A6', OL(2));
  };
  const seat = [-30, -144], head = [66, -134], bar = [72, -160];
  const fr = (a, b, w = 7) => Line(a[0], a[1], b[0], b[1], C.line, w + 5) + Line(a[0], a[1], b[0], b[1], frame, w);
  const pedal = a => [BB[0] + Math.cos(a) * 18, BB[1] + Math.sin(a) * 18];
  const pF = pedal(crank), pB = pedal(crank + Math.PI);
  const frameSVG = fr(RW, BB) + fr(RW, [seat[0] + 6, seat[1] + 14]) + fr(BB, [seat[0] + 4, seat[1] + 12]) + fr([seat[0] + 5, seat[1] + 18], head) + fr(BB, head) + fr(head, FW, 6)
    + Path(`M${seat[0] - 18},${seat[1] - 4} Q${seat[0]},${seat[1] - 12} ${seat[0] + 16},${seat[1] - 5} L${seat[0] + 14},${seat[1] + 2} L${seat[0] - 16},${seat[1] + 2} Z`, C.black, OL(2.5))
    + fr(head, bar, 5) + Line(bar[0] - 10, bar[1], bar[0] + 12, bar[1] + 2, C.line, 7);
  // Beine via IK (Hüfte am Sattel, Fuß auf Pedal)
  const hip = [seat[0] + 2, seat[1] - 12];
  const legAng = (foot) => {
    const [k1, k2] = ik2(hip[0], hip[1], foot[0], foot[1] - 10, 68, 64);
    const k = k1[0] > k2[0] ? k1 : k2;       // Knie nach vorn
    const h = angOf(k[0] - hip[0], k[1] - hip[1]);
    const sh = angOf(foot[0] - k[0], foot[1] - 10 - k[1]);
    return { hip: h, knee: h - sh };
  };
  const crankSVG = (p) => Line(BB[0], BB[1], p[0], p[1], C.line, 7) + Line(BB[0], BB[1], p[0], p[1], '#7A8387', 3.5) + Rect(p[0] - 8, p[1] - 3, 16, 6, C.black, { rx: 2 });
  const person = Person({
    ...o.person, x: 0, y: 0, s: 1, dir: 1, walk: 0,
    hipY: hip[1], lean: 24,
    legs: { f: legAng(pF), b: legAng(pB) },
    reachF: [bar[0] + 6, bar[1] + 2], reachB: [bar[0] - 4, bar[1] + 2],
    before: wheel(RW) + wheel(FW) + crankSVG(pB),
    afterFarLeg: frameSVG + Circ(BB[0], BB[1], 10, '#7A8387', OL(2.5)),
    after: crankSVG(pF),
  });
  return G({ transform: `translate(${N(o.x)} ${N(o.y)}) scale(${N(s * dir)} ${N(s)})` }, person);
}

// Der Schatten: gesichtslose, halbtransparente Silhouette – ohne Kapuze, ohne Gesicht
function Shade(o) {
  const s = o.s ?? 1, dir = o.dir ?? 1;
  const walk = o.walk ?? 0, ph = o.phase ?? 0;
  const L1 = 70, L2 = 66, ANK = 10, TOR = 88;
  const amp = 17 * walk;
  const legAt = psi => ({ hip: amp * Math.sin(psi), knee: 4 + 34 * walk * Math.pow(Math.max(0, Math.cos(psi)), 2) });
  const lf = walk ? legAt(ph) : { hip: 4, knee: 3 }, lb = walk ? legAt(ph + Math.PI) : { hip: -4, knee: 3 };
  const bob = walk * 6 * Math.pow(Math.sin(ph), 2);
  const hipY = -(L1 + L2 + ANK) + bob;
  const shY = hipY - TOR;
  const lean = o.lean ?? walk * 3;
  let af = { sh: -13 * walk * Math.sin(ph) + 4, el: 12 }, ab = { sh: 13 * walk * Math.sin(ph) - 4, el: 12 };
  if (o.arms) { af = o.arms.f || af; ab = o.arms.b || ab; }
  const shF = [20, shY + 10], shB = [-18, shY + 10];
  const toLocal = (wx, wy) => {
    const lx = (wx - o.x) / (s * dir), ly = (wy - o.y) / s;
    const c = Math.cos(-lean * DEG), sn = Math.sin(-lean * DEG), dx = lx, dy = ly - hipY;
    return [dx * c - dy * sn, hipY + dx * sn + dy * c];
  };
  if (o.reachF) {
    const [tx, ty] = toLocal(o.reachF[0], o.reachF[1]);
    const [e1, e2] = ik2(shF[0], shF[1], tx, ty, 56, 52);
    const e = e1[1] > e2[1] ? e1 : e2;
    const a1 = angOf(e[0] - shF[0], e[1] - shF[1]), a2 = angOf(tx - e[0], ty - e[1]);
    af = { sh: a1, el: a2 - a1 };
  }
  const legP = (hx, l) => { const k = pt(hx, hipY, l.hip, L1); const a = pt(k[0], k[1], l.hip - l.knee, L2); return [[hx, hipY], k, [a[0], a[1] + 4]]; };
  const armP = (sp, a) => { const e = pt(sp[0], sp[1], a.sh, 56); const w = pt(e[0], e[1], a.sh + a.el, 52); return [sp, e, w]; };
  const col = C.shadow;
  const limb = (p, w) => Poly(p, col, w);
  const pa = armP(shF, af), pb = armP(shB, ab);
  let upper = limb(pb, 19) + Circ(pb[2][0], pb[2][1], 10, col)
    + Path(`M-27,${shY + 10} Q-26,${shY - 4} -12,${shY - 5} L14,${shY - 5} Q28,${shY - 4} 29,${shY + 10} L24,${hipY + 6} Q0,${hipY + 12} -22,${hipY + 6} Z`, col)
    + Rect(-8, shY - 16, 16, 20, col)
    + Ell(2, shY - 34, 22, 27, col)
    + limb(pa, 19) + Circ(pa[2][0], pa[2][1], 10, col);
  const body = limb(legP(-9, lb), 26) + limb(legP(9, lf), 26) + G({ transform: lean ? `rotate(${N(lean)} 0 ${N(hipY)})` : undefined }, upper);
  if (o.out) {
    const c = Math.cos(lean * DEG), sn = Math.sin(lean * DEG);
    const w = ([lx, ly]) => { const dx = lx, dy = ly - hipY; return [o.x + (dx * c - dy * sn) * s * dir, o.y + (hipY + dx * sn + dy * c) * s]; };
    o.out.handF = w(pa[2]); o.out.handB = w(pb[2]); o.out.head = w([2, shY - 34]);
  }
  const op = o.opacity ?? 0.92;
  // weicher Bodenschatten, dunkler Halo, leicht weichgezeichneter Kern
  const ground = Ell(0, 2, 62, 11, C.shadow, { opacity: 0.22, filter: 'url(#fShadeSoft)' });
  return G({ transform: `translate(${N(o.x)} ${N(o.y)}) scale(${N(s * dir)} ${N(s)})`, opacity: op },
    ground + G({ filter: 'url(#fShadeHalo)', opacity: 0.32 }, body) + G({ filter: 'url(#fShadeSoft)', 'stroke-linecap': 'round' }, body));
}

/* =====================================================================
   6  SYMBOLE: Schlüssel, Schlüsselbund, Glanz
   ===================================================================== */
// Schlüssel hängend: Ursprung = Ringmitte oben; Bart unten
function Key(x, y, s = 1, rot = 0, o = {}) {
  const gold = o.gold || C.gold;
  let k = '';
  if (!o.noRing) k += Circ(0, 0, 8, 'none', { stroke: C.line, 'stroke-width': 5.5 }) + Circ(0, 0, 8, 'none', { stroke: '#C8CED1', 'stroke-width': 2.5 });
  k += Path('M-15,24 a15,15 0 1,0 30,0 a15,15 0 1,0 -30,0 Z M-5.5,24 a5.5,5.5 0 1,1 11,0 a5.5,5.5 0 1,1 -11,0 Z', gold, { ...OL(3), 'fill-rule': 'evenodd' });
  k += Path('M-4.5,38 L4.5,38 L4.5,88 L-4.5,88 Z', gold, OL(3));
  k += Path('M4,66 L15,66 L15,71 L11,71 L11,75 L15,75 L15,84 L4,84 Z', gold, OL(3));
  k += Path('M-10,17 Q-6,11 0,10', 'none', { stroke: C.goldLight, 'stroke-width': 3, 'stroke-linecap': 'round' });
  return G({ transform: TR(x, y, s, rot) }, k);
}
// Schlüsselbund: n Schlüssel fächern sich am Ring auf (spread 0..1)
function KeyRing(x, y, s = 1, spread = 1, rot = 0, skipMain = false) {
  const angs = [0, -30, 30, -52, 52];
  const golds = [C.gold, '#D9A92F', '#E8C052', '#CF9E2A', '#EDC968'];
  let k = '';
  for (let i = angs.length - 1; i >= (skipMain ? 1 : 0); i--) {
    const a = i === 0 ? 0 : angs[i] * spread;
    const op = i === 0 ? 1 : clamp(spread * 1.6 - 0.1 * i);
    if (op <= 0.01) continue;
    k += G({ opacity: op }, Key(0, 0, i === 0 ? 1 : 0.92, a, { gold: golds[i], noRing: true }));
  }
  k += Circ(0, 0, 11, 'none', { stroke: C.line, 'stroke-width': 6 }) + Circ(0, 0, 11, 'none', { stroke: '#C8CED1', 'stroke-width': 3 });
  return G({ transform: TR(x, y, s, rot) }, k);
}
// Glanz (vierzackiger Stern)
const Glint = (x, y, k) => k <= 0.01 ? '' : G({ transform: TR(x, y, k), opacity: clamp(k * 1.4) }, Path('M0,-16 L3.5,-3.5 L16,0 L3.5,3.5 L0,16 L-3.5,3.5 L-16,0 L-3.5,-3.5 Z', '#FFFFFF', { stroke: C.goldLight, 'stroke-width': 1.5 }));

/* =====================================================================
   7  OBERFLÄCHE: Karten, Hinweise, Vertraulich-Vermerk, Untertitel
   ===================================================================== */
function Card(x, y, w, h, o = {}) {
  const accent = o.accent || C.gruen;
  return G({ opacity: o.opacity ?? 1, transform: o.dy ? `translate(0 ${N(o.dy)})` : undefined, filter: 'url(#fCardShadow)' },
    Rect(x, y, w, h, o.fill || '#FFFFFF', { rx: 18, opacity: o.fillOpacity ?? 0.94 }) +
    Rect(x, y + 22, 9, h - 44, accent, { rx: 4.5 }) + (o.inner || ''));
}
function Confidential(op = 1) {
  const label = TEXTE.vertraulich;
  const w = measure(label, 22) + 32;
  return G({ opacity: op }, Rect(36, H - 36 - 40, w, 40, '#FFFFFF', { rx: 8, opacity: 0.86, 'data-rahmen': 'vertraulich' }) + Txt(52, H - 36 - 13, label, { size: 22, fill: C.text2, k: 'vertraulich', i: 0 }));
}
// Untertitel unten mittig auf halbtransparentem Band
const SUB = { size: 44, lh: 56, padX: 30, padY: 15, bottom: 50, bottomHoch: 96, bandOpacity: 0.78 };
function cueAt(t) { for (const c of CUES) if (t >= c.start && t < c.end) return c; return null; }
function SubtitleSVG(t) {
  const c = cueAt(t);
  if (!c) return '';
  const a = fadeIO(t, c.start, c.start + 0.12, c.end - 0.12, c.end);
  const widths = c.lines.map(l => measure(l, SUB.size));
  const bw = Math.max(...widths) + SUB.padX * 2;
  const bh = c.lines.length * SUB.lh + SUB.padY * 2 - (SUB.lh - SUB.size) + 4;
  // Titelkarte und Schlusstafel tragen unten links den Vertraulich-Vermerk: dort steht der Untertitel darüber
  const hoch = c.start < SCENES[0].end + XFADE / 2 || c.end > TOTAL - SCHLUSS_DAUER - 0.4;
  const by = H - (hoch ? SUB.bottomHoch : SUB.bottom) - bh, bx = (W - bw) / 2;
  let s = Rect(bx, by, bw, bh, C.text, { rx: 10, opacity: SUB.bandOpacity, 'data-rahmen': 'sub' });
  const ci = CUES.indexOf(c);
  c.lines.forEach((l, i) => { s += Txt(W / 2, by + SUB.padY + SUB.size * 0.8 + i * SUB.lh + 2, l, { size: SUB.size, fill: '#FFFFFF', anchor: 'middle', k: 'sub', i, cue: ci }); });
  return G({ opacity: a }, s);
}


// SITS-Marke oben rechts: Logo in Originalgröße (nicht skaliert), darunter die Zeile; verschwindet mit der Schlusstafel
// (dort steht das Logo mit derselben Zeile mittig unter dem Stadt-Herne-Text).
const MARKE = { rechts: 1896, oben: 24, pad: 12, schrift: 15, lh: 18, maxB: 1000 };   // Zeile unter dem Logo einzeilig
function markeBlock(x, y, o = {}) {           // Logo mit der Zeile darunter; x = rechte Kante (anchor end) bzw. Mitte (anchor middle)
  const mitte = o.anchor === 'middle';
  const lines = wrapLines(TEXTE.marke_zeile, MARKE.schrift, 400, MARKE.maxB);
  const lx = mitte ? x - LOGO.w / 2 : x - LOGO.w;
  let g = `<image href="${LOGO.uri}" x="${N(lx)}" y="${N(y)}" width="${LOGO.w}" height="${LOGO.h}"/>`;
  lines.forEach((l, i) => { g += Txt(x, y + LOGO.h + 8 + MARKE.schrift + i * MARKE.lh, l, { size: MARKE.schrift, fill: C.text2, anchor: mitte ? 'middle' : 'end', k: 'marke_zeile', i }); });

    setStyle(slot.tint, slot.cache, 'to', 'opacity', String(g.ta));
  });
  setHTML(brandLayer, brandCache, 'v', BrandSVG(t));
  setHTML(subLayer, subCache, 'v', SubtitleSVG(t));
  return t;
}

/* =====================================================================
   13  INITIALISIERUNG, VORSCHAU, EXPORT-SCHNITTSTELLE
   ===================================================================== */
function globalDefs() {
  return `<filter id="fShadeHalo" x="-60%" y="-30%" width="220%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>`
    + `<filter id="fShadeSoft" x="-20%" y="-10%" width="140%" height="120%"><feGaussianBlur stdDeviation="1.1"/></filter>`
    + `<filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>`
    + `<filter id="fCardShadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F292D" flood-opacity="0.18"/></filter>`
    + `<radialGradient id="gVig" cx="0.5" cy="0.5" r="0.72"><stop offset="0.55" stop-color="#0E1418" stop-opacity="0"/><stop offset="1" stop-color="#0E1418" stop-opacity="0.34"/></radialGradient>`
    + `<g id="vignette"><rect x="0" y="0" width="${W}" height="${H}" fill="url(#gVig)"/></g>`;
}
const EXPORT = new URLSearchParams(location.search).has('export');
if (EXPORT) document.body.classList.add('export');

function init() {
  defsEl.innerHTML = globalDefs() + SCENE_OBJ.map(s => s.defs()).join('');
  render(0);
}

// Vorschau-Player (nur hier wird Echtzeit genutzt, um t fortzuschreiben)
const player = { t: 0, playing: false, last: 0 };
const $ = id => document.getElementById(id);
function fmtTC(t) { const f = Math.round(t * FPS); const m = Math.floor(f / (60 * FPS)), s = Math.floor(f / FPS) % 60, fr = f % FPS; return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(fr).padStart(2, '0')}`; }
function seek(t) {
  player.t = clamp(Math.round(t * FPS) / FPS, 0, TOTAL - 1 / FPS);
  render(player.t);
  $('scrub').value = player.t;
  $('tc').textContent = `${fmtTC(player.t)} / ${fmtTC(TOTAL)}`;
  const sc = SCENES.find(s => player.t >= s.start && player.t < s.end) || SCENES[SCENES.length - 1];
  $('sceneName').textContent = `Szene ${sc.n} – ${sc.title}`;
  document.querySelectorAll('#sceneBtns button').forEach(b => b.classList.toggle('on', +b.dataset.n === sc.n));
}
function loop(now) {
  if (!player.playing) return;
  const dt = Math.min(0.1, (now - player.last) / 1000); player.last = now;
  let t = player.t + dt;
  if (t >= TOTAL) { t = TOTAL - 1 / FPS; player.playing = false; $('bPlay').textContent = '▶ Abspielen'; }
  player.t = t; render(t);
  $('scrub').value = t; $('tc').textContent = `${fmtTC(t)} / ${fmtTC(TOTAL)}`;
  const sc = SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
  $('sceneName').textContent = `Szene ${sc.n} – ${sc.title}`;
  requestAnimationFrame(loop);
}
function togglePlay() {
  player.playing = !player.playing;
  $('bPlay').textContent = player.playing ? '⏸ Pause' : '▶ Abspielen';
  if (player.playing) { player.last = performance.now(); requestAnimationFrame(loop); }
}
function fit() {
  if (EXPORT) { stage.style.transform = 'none'; return; }
  const vp = $('viewport');
  stage.style.transform = `scale(${vp.clientWidth / W})`;
}
function setupPlayer() {
  $('scrub').max = TOTAL;
  $('bPlay').onclick = togglePlay;
  $('bStart').onclick = () => seek(0);
  $('bBackS').onclick = () => seek(player.t - 1);
  $('bNextS').onclick = () => seek(player.t + 1);
  $('bBackF').onclick = () => seek(player.t - 1 / FPS);
  $('bNextF').onclick = () => seek(player.t + 1 / FPS);
  $('scrub').oninput = e => seek(+e.target.value);
  const sb = $('sceneBtns');
  SCENES.forEach(sc => { const b = document.createElement('button'); b.textContent = `${sc.n} · ${sc.title}`; b.dataset.n = sc.n; b.title = `${fmtTC(sc.start)}–${fmtTC(sc.end)}`; b.onclick = () => seek(sc.start); sb.appendChild(b); });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') seek(player.t + (e.shiftKey ? 1 : 1 / FPS));
    else if (e.key === 'ArrowLeft') seek(player.t - (e.shiftKey ? 1 : 1 / FPS));
    else if (e.key === 'Home') seek(0);
    else if (/^[0-9]$/.test(e.key)) seek(SCENES[+e.key].start);
    else if (e.key === 'PageDown' || e.key === 'PageUp') { const i = SCENES.findIndex(x => player.t >= x.start && player.t < x.end); seek(SCENES[Math.max(0, Math.min(SCENES.length - 1, i + (e.key === 'PageDown' ? 1 : -1)))].start); }
  });
  window.addEventListener('resize', fit);
  fit(); seek(0);
}

// Export-Schnittstelle
window.VIDEO = { W, H, FPS, TOTAL, SCENES, SZENEN, ANKER, BILDENDE, SUB, TIMELINE, CUES, SPRECHERTEXT, PRESSEFRAGEN, TEXTE, TEXTE_AUSNAHMEN, SYNC, LOGO, MARKE, toActual, toDesign, SCHLUSS_DAUER, frames: Math.round(TOTAL * FPS) };
window.renderFrame = t => render(t);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  init();
  if (!EXPORT) setupPlayer();
  window.__ready = true;
});
</script>
</body>
